project:
  name: 'SecMesh-PQSI: Formal Algebraic and Information-Theoretic Foundations for Post-Quantum and Post-Super-Intelligence
    Mesh Cryptography'
  description: Zero-Mathlib Lean 4.35.0 formalization of 28 theorem statements across seven families (T1-T7)
    plus 5 zero-axiom adversarial examples underlying the SecMesh-PQSI hybrid cryptographic defense engine.
    All statements are elementary integer, Boolean or polynomial facts behind known results; quantum,
    probabilistic and protocol readings are paper-level and are not defined in Lean. (T1) fixed-number
    arithmetic on defects of the legacy SecMesh v1 prototype; (T2) combinatorial cores of the one-time
    pad, XOR combining, Toeplitz hashing, an integer Cauchy-Schwarz inequality and the polynomial root
    bound behind Carter-Wegman MACs (no probabilistic secrecy statement is formalized); (T3) Shamir t-point
    uniqueness and (t-1)-share consistency, Reed-Solomon unique decoding for n >= t + 2b (tightness only
    as the arithmetic d = 2b), and an arithmetic comparison of two published K = 1 PIR rate formulas (Tajeddine
    et al., arXiv:1806.08006; no PIR object is formalized); (T4) polynomial identities for a two-qubit
    family, including the integer form of the Jakob-Bergou complementarity identity c_eff^2 + C^2 = 1
    (arXiv:quant-ph/0302075), and CSS orthogonality and row weight 6 of the explicit Bravyi et al. [[144,12,12]]
    gross-code matrices (k = 12 by GF(2) rank outside Lean; distance 12 quoted); (T5) ML-KEM parameter
    arithmetic (3329 prime, 17 of order 256, Montgomery reduction) and a Compress_1 margin |e| <= 831
    for a Lean model that differs from FIPS 203 at x = 832, plus K_N bandwidth arithmetic; (T6) Laplacian
    and Ising quadratic forms and Boolean counting facts (no Cheeger inequality is proved); and (T7) the
    final Cauchy-Schwarz step of Toner-Verstraete CHSH monogamy (arXiv:quant-ph/0611001) with the quantum
    reduction and a CKW-type relation assumed, the identity TV + Overlap = 1 for finite distributions,
    and classical Fuchs-van de Graaf bounds for square-integer weights.
