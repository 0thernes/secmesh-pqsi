status:
  scope: 'Zero-Mathlib Lean 4.35.0 formalization of all 28 theorem statements T1a-T7c (integer, Boolean
    and polynomial identities and inequalities) plus concrete non-vacuity witnesses (SecMeshPQSI/NonVacuity.lean,
    including SimpleField (Fin 5)). sorry_count 0 excludes the 28 comparator challenge stubs in PalomarChallenge.lean.
    Not formalized in Lean: quantum states, operators, entropy, Fisher information, Berry curvature or
    Chern numbers, probability distributions as a type, PIR or commitment schemes and EFI pairs (these
    readings are paper-level); the exported T4c1 assumes its conclusion and T3b tightness is only d =
    2b arithmetic (see ERRATA.md); real-analytic transcendental logarithms/exponentials (Bernoulli KL-Chernoff
    inversion and binary entropy numerical evaluations, verified to 60-digit precision in Python and differentially
    against C11/Node), side-channel timing/hardware leakage of C11/OpenSSL executables, computational
    hardness conjectures (LWE/MLWE), or physical photonic Bell-test loophole closure.'
