project:
  name: "SecMesh-PQSI: Formal Algebraic and Information-Theoretic Foundations for Post-Quantum and Post-Super-Intelligence Mesh Cryptography"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 21 theorems across five mathematical
    families (T1-T5) underlying the SecMesh-PQSI hybrid cryptographic defense engine:
    (T1) forensic resolution of finite-key DI-QKD/E91 defects in upstream SecMesh v1
    (super-quantum Tsirelson violation 354/125 > 2*sqrt(2), factor-of-4 range-2 Hoeffding
    exponent error, quarter-circle duality between von Neumann and Pironio DI min-entropy,
    8-bit majority deNoise bias 93/256 and fragility 70/256, and composable epsilon
    conservation); (T2) unconditional information-theoretic Post-Super-Intelligence (PSI)
    security (Shannon OTP bijection, hybrid XOR dual-survivability, constructive general-dimension
    binary Toeplitz exact 2-universality, integer Cauchy-Schwarz Leftover Hash Lemma core,
    and general-field Carter-Wegman degree-d polynomial root bound); (T3) Shamir (t,n)
    exact threshold reconstruction and (t-1)-collusion zero-leakage secrecy, Byzantine
    Singleton bound tightness n >= t + 2b, and CS-053 colluding/coded Byzantine PIR
    capacity gap; (T4) D-dimensional complex QGT Hermitian PSD Lagrange/trace uncertainty,
    an exact closed-form QGT Concurrence Surplus identity det(g) - (1/4)Omega^2 = (C^2/4)sin^2(theta/2)
    bridging QGTL to Horodecki CHSH, and general + Bravyi [[144,12,12]] Gross BB qLDPC
    CSS orthogonality; and (T5) FIPS 203 ML-KEM prime q=3329 / primitive 256-th NTT root
    zeta=17, exact zero-overflow Montgomery reduction, exact Compress_1 error margin |e|<=831,
    and complete-graph K_N wire-bandwidth ceiling optimality.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
    - name: "Alexander S. Donahue"
