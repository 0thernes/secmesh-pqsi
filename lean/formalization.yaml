automation:
  methods:
    - method: "manual"
      notes: "Alexander S. Donahue conceived the project scope, directed the forensic audit of upstream SecMesh and Tsotchke stack integration, reviewed every theorem statement against cryptographic standards, and approved publication."
    - method: "agent"
      models:
        - "Gemini (Antigravity)"
      framework: "Antigravity"
      notes: >-
        Assisted with formal Lean 4.35 proof engineering, C11/Node/Python/Eshkol
        implementation, differential testing, and manuscript drafting under human
        supervision. All 25 theorems are verified independently by all 6 distinct Lean 4.35
        proof kernels (results/six_kernel_audit.txt).

fidelity:
  divergences: >-
    Transcendental real-number bounds (Hoeffding exponential, binary entropy h(p),
    and trigonometric cos/sin) are formalized via exact integer/rational algebraic
    identities and cleared-denominator inequalities (T1a, T1b, T1c, T4b) so the
    Lean trusted computing base requires zero Mathlib dependencies; transcendental
    numerical curves are cross-verified to 60-digit decimal precision in Python and
    against C11/Node implementations.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Machine-checked across all 6 distinct Lean 4.35
    kernel implementations via lake comparator --paranoid on Ubuntu CI (Lean paranoid,
    lean4lean, nanoda, con-leche --verified, con-ron --verified, Lean default) and 5
    distinct local Windows kernels (results/six_kernel_audit.txt) with 0 warnings,
    0 proof sorries, and concrete non-vacuity witnesses in lean/SecMeshPQSI/NonVacuity.lean.
