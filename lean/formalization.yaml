project:
  name: "SecMesh-PQSI: Formal Algebraic and Information-Theoretic Foundations for Post-Quantum and Post-Super-Intelligence Mesh Cryptography"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 25 theorems across six mathematical
    families (T1-T6) underlying the SecMesh-PQSI hybrid cryptographic defense engine:
    (T1) forensic resolution of finite-key DI-QKD/E91 defects in upstream SecMesh v1;
    (T2) unconditional information-theoretic Post-Super-Intelligence (PSI) security
    (Shannon OTP, XOR dual-survivability, Toeplitz 2-universality, Cauchy-Schwarz LHL,
    Carter-Wegman polynomial root bound); (T3) Shamir (t,n) threshold secrecy,
    Byzantine Singleton tightness n >= t + 2b, and CS-053 PIR capacity gap;
    (T4) D-dim QGT PSD, exact QGT Concurrence Surplus, general + Bravyi [[144,12,12]]
    Gross BB qLDPC CSS orthogonality, Topological Chern-Concurrence-Entropy
    Conservation Law c_eff^2 + C^2 = 1, and libirrep spin-j GHZ Heisenberg QFI scaling;
    (T5) FIPS 203 ML-KEM NTT/Montgomery/Compress_1 invariants & K_N wire ceilings; and
    (T6) Discrete Laplacian PSD, Ising cut-energy bijection, Cheeger expander contagion
    barrier, and Simmons subliminal-channel / threshold-hedged kleptography closure.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
    - name: "Alexander S. Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
  license: "Apache-2.0"

