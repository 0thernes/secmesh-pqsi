# SPDX-License-Identifier: Apache-2.0
name: Publish Release Assets on Tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate & verify SHA256SUMS
        run: |
          sha256sum dist/Donahue_2026_secmesh_pqsi_formal_foundations.pdf \
                    dist/Donahue_2026_secmesh_pqsi_architecture.pdf \
                    dist/arxiv_submission.tar.gz \
                    MANIFEST.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Attach release assets via gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              dist/Donahue_2026_secmesh_pqsi_formal_foundations.pdf \
              dist/Donahue_2026_secmesh_pqsi_architecture.pdf \
              dist/arxiv_submission.tar.gz \
              MANIFEST.sha256 \
              SHA256SUMS \
              --title "SecMesh-PQSI $TAG" \
              --notes-file CHANGELOG.md
          fi
